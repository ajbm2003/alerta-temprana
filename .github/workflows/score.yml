name: Scoring diario (cron gratis vía GitHub)
on:
  schedule:
    - cron: "0 11 * * *"   # 6:00 AM Colombia (UTC-5)
  workflow_dispatch:
jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl --fail-with-body --show-error --max-time 300 -X POST "${{ secrets.API_URL }}/score-batch" -H "Authorization: Bearer ${{ secrets.API_TOKEN }}"
